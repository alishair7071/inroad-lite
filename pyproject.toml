[project]
name = "inroad-lite"
version = "0.1.0"
description = "Find companies hiring for your roles, using Olostep search and public job boards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
inroad-lite = "inroad_lite.web.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inroad_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
